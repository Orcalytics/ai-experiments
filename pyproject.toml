[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcalytics-experiments"
version = "0.1.0"
description = "Reproducible industry, event, emotion, and sentiment experiments for Orcalytics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "ruff>=0.9,<1", "build>=1,<2"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]

[project.scripts]
orcalytics = "orcalytics_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orcalytics_experiments = ["resources/prompts/*.txt", "resources/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
